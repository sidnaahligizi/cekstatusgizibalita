<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Gizi SIDNA</title>
    <style>
        :root {
            --primary: #1a73e8;
            --bg-gradient: linear-gradient(180deg, #1976d2 0%, #64b5f6 100%);
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0; padding: 0; background: var(--bg-gradient);
            min-height: 100vh; display: flex; justify-content: center; align-items: center;
            color: white;
        }
        .app-container {
            width: 100%; max-width: 400px; padding: 20px; box-sizing: border-box;
        }
        .logo-container { text-align: center; margin-bottom: 20px; }
        .logo-container img {
            width: 120px; border-radius: 50%; border: 4px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; margin-bottom: 5px; font-size: 24px;}
        .subtitle { text-align: center; margin-bottom: 25px; font-size: 14px; opacity: 0.9;}
        
        .form-group {
            margin-bottom: 15px; background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3); border-radius: 8px; padding: 5px 15px;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background: transparent;
            border: none; color: white; font-size: 16px; outline: none; box-sizing: border-box;
        }
        .form-group input::placeholder { color: rgba(255, 255, 255, 0.7); }
        .form-group input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
        .form-group option { color: black; }
        
        .btn-submit {
            width: 100%; padding: 15px; background-color: #fbc02d; color: #000;
            border: none; border-radius: 8px; font-size: 18px; font-weight: bold;
            cursor: pointer; margin-top: 15px; transition: 0.3s;
        }
        .btn-submit:disabled { background-color: #999; cursor: not-allowed; }

        .result-card {
            display: none; background: white; color: #333;
            border-radius: 15px; padding: 20px; text-align: center;
        }
        .metrics { font-size: 18px; font-weight: bold; color: #1a73e8; margin: 10px 0; }
        
        .btn-wa {
            background-color: #25D366; color: white; padding: 10px 20px;
            border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer; width: 100%; margin-top: 15px;
        }
        #loading { display: none; text-align: center; margin-top: 10px; font-weight: bold; color: #fff;}
        
        /* Dynamic Status Colors */
        .status-box { text-align: left; font-size: 14px; line-height: 1.6; background: #f8f9fa; padding: 12px; border-radius: 8px; }
        .status-normal { color: #2e7d32; font-weight: bold; }
        .status-warning { color: #f57c00; font-weight: bold; }
        .status-danger { color: #c62828; font-weight: bold; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="logo-container">
        <img src="logo_sidna.png" alt="SIDNA" onerror="this.src='https://lh3.googleusercontent.com/d/1hGSRD5dNVoF7TKUgF7nAZVqQ6wXFI3wj'">
    </div>

    <div id="formSection">
        <h2>Kalkulator Gizi SIDNA</h2>
        <div class="subtitle">= WHO Anthro 2020 Validasi =</div>

        <div class="form-group"><input type="text" id="nama" placeholder="Nama Lengkap" required></div>
        <div class="form-group">
            <select id="gender">
                <option value="" disabled selected>Jenis Kelamin</option>
                <option value="L">Laki-laki</option>
                <option value="P">Perempuan</option>
            </select>
        </div>
        <div class="form-group"><input type="date" id="tglLahir" required></div>
        <div class="form-group"><input type="number" id="tinggi" placeholder="Tinggi Badan (cm)" step="0.1" required></div>
        <div class="form-group"><input type="number" id="berat" placeholder="Berat Badan (kg)" step="0.1" required></div>

        <button class="btn-submit" id="btnCek" onclick="hitungGizi()">CEK STATUS GIZI</button>
        <div id="loading">Menganalisis data dari server...</div>
    </div>

    <div id="resultSection" class="result-card">
        <h3 id="resNama" style="margin: 0;">Nama</h3>
        <div id="resUmur" style="font-size: 14px; color: #666; margin-bottom: 10px;"></div>
        
        <div class="metrics"><span id="resTinggi">0</span> cm | <span id="resBerat">0</span> kg</div>
        
        <div class="status-box">
            <strong>Indikator Z-Score (0-60 Bulan):</strong><br>
            • Berat/Umur: <span id="resBBU">...</span> <br> 
              <span id="statBBU" style="padding-left: 10px; display:block; margin-bottom: 5px;"></span>
            • Tinggi/Umur: <span id="resTBU">...</span> <br> 
              <span id="statTBU" style="padding-left: 10px; display:block;"></span>
        </div>
        
        <p style="font-size: 14px; margin-top: 15px;"><strong>Saran:</strong> <br><span id="resSaran">...</span></p>

        <button class="btn-wa" onclick="bagikanWA()">Bagikan ke WhatsApp</button>
        <button onclick="resetForm()" style="background:none; border:none; color:#1a73e8; margin-top:15px; cursor:pointer; text-decoration:underline;">Hitung Ulang</button>
    </div>

    <div style="text-align: center; margin-top: 30px; font-size: 12px; font-weight: bold; opacity: 0.8;">
        sidnaahligizi
    </div>
</div>

<script>
    // URL WEB APP APPS SCRIPT BAPAK
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw-XKBBIJR-DJ3p9vXmXlZNN9mlbLE4chXVqeJgxAMNLZ1RdTEGnVajW_A0j-smvKFs/exec"; 

    function hitungGizi() {
        const payload = {
            nama: document.getElementById('nama').value,
            gender: document.getElementById('gender').value,
            tglLahir: document.getElementById('tglLahir').value,
            tinggi: document.getElementById('tinggi').value,
            berat: document.getElementById('berat').value
        };

        if(!payload.nama || !payload.gender || !payload.tglLahir || !payload.tinggi || !payload.berat) {
            alert("Harap isi semua kolom pengukuran!"); return;
        }

        document.getElementById('btnCek').disabled = true;
        document.getElementById('loading').style.display = "block";

        fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(response => response.json())
        .then(data => {
            document.getElementById('loading').style.display = "none";
            document.getElementById('btnCek').disabled = false;

            if(data.status === "success") {
                tampilkanHasil(payload, data.data);
            } else {
                alert("Pesan Sistem: " + data.message); 
            }
        })
        .catch(error => {
            document.getElementById('loading').style.display = "none";
            document.getElementById('btnCek').disabled = false;
            alert("Koneksi gagal. Pastikan URL Web App sudah di-deploy dengan benar.");
        });
    }

    // Fungsi pewarnaan status agar menarik
    function getColorClass(status) {
        let s = status.toLowerCase();
        if(s.includes("normal")) return "status-normal";
        if(s.includes("kurang") || s.includes("stunting") || s.includes("pendek") || s.includes("risiko")) return "status-danger";
        return "status-warning";
    }

    function tampilkanHasil(input, hasil) {
        document.getElementById('formSection').style.display = 'none';
        document.getElementById('resultSection').style.display = 'block';

        const tahun = Math.floor(hasil.umurBulan / 12);
        const bulan = hasil.umurBulan % 12;

        document.getElementById('resNama').innerText = input.nama;
        document.getElementById('resUmur').innerText = `= Umur: ${tahun} Tahun ${bulan} Bulan =`;
        document.getElementById('resTinggi').innerText = input.tinggi;
        document.getElementById('resBerat').innerText = input.berat;
        
        document.getElementById('resBBU').innerText = (hasil.zBBU !== null) ? hasil.zBBU : "N/A";
        let elemStatBBU = document.getElementById('statBBU');
        elemStatBBU.innerText = "↳ " + hasil.statBBU;
        elemStatBBU.className = getColorClass(hasil.statBBU);
        
        document.getElementById('resTBU').innerText = (hasil.zTBU !== null) ? hasil.zTBU : "N/A";
        let elemStatTBU = document.getElementById('statTBU');
        elemStatTBU.innerText = "↳ " + hasil.statTBU;
        elemStatTBU.className = getColorClass(hasil.statTBU);
        
        document.getElementById('resSaran').innerText = hasil.saran;
    }

    function bagikanWA() {
        const nama = document.getElementById('resNama').innerText;
        const bbu = document.getElementById('statBBU').innerText.replace("↳ ", "");
        const tbu = document.getElementById('statTBU').innerText.replace("↳ ", "");
        
        const pesan = `*Laporan Status Gizi SIDNA*\n\nNama: ${nama}\n\n*Hasil Antropometri WHO*:\n- Berat Badan (BB/U): ${bbu}\n- Tinggi Badan (TB/U): ${tbu}\n\n_sidnaahligizi_`;
        window.open(`https://wa.me/?text=${encodeURIComponent(pesan)}`, '_blank');
    }

    function resetForm() {
        document.getElementById('formSection').style.display = 'block';
        document.getElementById('resultSection').style.display = 'none';
    }
</script>

</body>
</html>
